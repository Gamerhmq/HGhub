
name: Build Desktop Windows x64

on:
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64
        run: pnpm tauri build --bundles nsis --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = (Get-Content "package.json" | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $setup = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1

          if (-not $setup) {
            throw "NSIS installer not found"
          }

          Copy-Item $setup.FullName "artifacts/HGhub_${v}_x64_setup.exe"

          $bin = "src-tauri/target/x86_64-pc-windows-msvc/release/huangguo-client.exe"

          if (-not (Test-Path $bin)) {
            throw "Portable executable not found"
          }

          Compress-Archive -Path $bin -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force

          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Windows-x64
          path: artifacts/*
          if-no-files-found: error
